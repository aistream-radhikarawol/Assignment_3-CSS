<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Radhika Rawol">

    <title>Contact | Radhika Rawol</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                Radhika Rawol
            </a>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="projects.html">Projects</a>

                <a href="contact.html">Contact</a>

            </div>

        </nav>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <section class="contact-section">

            <h1>Contact Me</h1>

            <p class="section-description">
                If you would like to contact me, please fill
                out the form below.
            </p>


            <!-- CONTACT FORM -->

            <form class="contact-form">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        required
                    ></textarea>

                </div>


                <!-- BUTTON -->

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Radhika Rawol. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
